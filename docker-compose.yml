services:
  gateway:
    image: nginx:1.30-alpine
    container_name: p2a_gateway
    # Loopback-only diagnostic port — not reachable from LAN/WAN.
    # Public access in production goes through Runtipi Traefik (see docker-compose.runtipi.yml).
    ports:
      - "127.0.0.1:${LOCAL_PORT:-8547}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    restart: unless-stopped
    networks:
      - default

  api:
    build: ./api
    container_name: p2a_api
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      MUSIC_LIBRARY_ROOT: /music
      COOKIES_DIR: /cookies
      UVICORN_HOST: 0.0.0.0
      UVICORN_PORT: 8000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8547,http://127.0.0.1:8547}
      MAX_DOWNLOAD_WORKERS: ${MAX_DOWNLOAD_WORKERS:-1}
      DTP_TUNES_API_URL: ${DTP_TUNES_API_URL:-http://host.docker.internal:8080}
      DTP_TUNES_INGEST_TOKEN: ${DTP_TUNES_INGEST_TOKEN:-}
    volumes:
      - ./data:/data
      - ${MUSIC_HOST_PATH:?Set MUSIC_HOST_PATH in .env}:/music
      - ${COOKIES_HOST_PATH:-./data/cookies}:/cookies
    # Loopback-only — used by dtp-os cookie sync and diagnostics.
    ports:
      - "127.0.0.1:8545:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--log-level", "info"]

  web:
    build: ./ui
    container_name: p2a_web
    environment:
      NEXT_PUBLIC_APP_NAME: VideoDL
      API_BASE_INTERNAL: http://api:8000
      NEXT_PUBLIC_API_BASE_EXTERNAL: ${NEXT_PUBLIC_API_BASE_EXTERNAL:-http://127.0.0.1:8547}
      SITE_PASSWORD: ${SITE_PASSWORD:-}
    depends_on:
      - api
    restart: unless-stopped
